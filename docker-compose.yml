services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zirel
      POSTGRES_PASSWORD: zirel
      POSTGRES_DB: zirel
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zirel"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://zirel:zirel@db:5433/zirel
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
